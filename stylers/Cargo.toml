[package]
name = "stylers"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Scoped CSS for Rust web frameworks like leptos"
keywords = ["web", "css", "leptos"]
categories = ["web-programming"]
readme = "../README.md"
documentation = "https://docs.rs/stylers"

[dependencies]
glob = "0.3"
syn = { version = "2.0", features = ["full"] }
stylers_core = { path = "../stylers_core", version = "0.4.0" }
stylers_macro = { path = "../stylers_macro", version = "0.4.0" }
proc-macro2 = "1.0"
